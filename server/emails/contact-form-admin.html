<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Contact Form Submission — {{app_name}}</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f3f4f6;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f3f4f6;">
    <tr>
      <td style="padding: 40px 20px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="margin: 0 auto; background-color: #0A0F1E; border-radius: 12px; overflow: hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color: #131A2B; padding: 28px 40px 24px 40px; border-bottom: 3px solid #00D9A3;">
              <div style="font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; font-family: Arial, sans-serif;">{{app_name}}</div>
              <div style="font-size: 11px; color: #00D9A3; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600; margin-top: 6px; font-family: Arial, sans-serif;">ADMIN NOTIFICATION</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px;">
              <h1 style="margin: 0 0 24px 0; font-size: 22px; font-weight: bold; color: #ffffff; font-family: Arial, sans-serif;">&#128235; New Contact Form Submission</h1>

              <!-- From -->
              <div style="margin-bottom: 16px;">
                <p style="margin: 0 0 4px 0; font-size: 11px; text-transform: uppercase; color: #6B7280; letter-spacing: 1px; font-family: Arial, sans-serif;">FROM</p>
                <p style="margin: 0; font-size: 16px; color: #ffffff; font-family: Arial, sans-serif;">{{from_name}} &lt;{{from_email}}&gt;</p>
              </div>

              <!-- Subject -->
              <div style="margin-bottom: 24px;">
                <p style="margin: 0 0 4px 0; font-size: 11px; text-transform: uppercase; color: #6B7280; letter-spacing: 1px; font-family: Arial, sans-serif;">SUBJECT</p>
                <p style="margin: 0; font-size: 16px; color: #ffffff; font-family: Arial, sans-serif;">{{subject}}</p>
              </div>

              <!-- Message -->
              <div style="border-top: 1px solid #1F2937; padding-top: 24px; margin-top: 8px;">
                <p style="margin: 0 0 12px 0; font-size: 11px; text-transform: uppercase; color: #6B7280; letter-spacing: 1px; font-family: Arial, sans-serif;">MESSAGE</p>
                <div style="background-color: #131A2B; border-radius: 8px; padding: 20px; border: 1px solid #1F2937;">
                  <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #D1D5DB; white-space: pre-wrap; font-family: Arial, sans-serif;">{{message}}</p>
                </div>
              </div>

              <!-- CTA -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 28px 0 0 0;">
                <tr>
                  <td style="background-color: #00D9A3; border-radius: 6px;">
                    <a href="mailto:{{from_email}}" style="display: inline-block; padding: 14px 28px; font-size: 15px; font-weight: bold; color: #000000; text-decoration: none; letter-spacing: 0.3px; font-family: Arial, sans-serif;">Reply to {{from_name}} &#8594;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #131A2B; padding: 28px 40px; border-top: 1px solid #1F2937;">
              <p style="margin: 0; font-size: 11px; color: #4B5563; font-family: Arial, sans-serif;">This message was sent via the {{app_name}} contact form. Admin notification only.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
