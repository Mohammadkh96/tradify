<aside class="studio">
<div><div class="studio-kicker">Tradify Signals / Mobile experience</div><h1>A clearer start.<br><span>A better flow.</span></h1><p>Three moments to understand the app.<br>One familiar place to make it yours.</p></div>

<script>
(() => {
'use strict';
const slides = [
 { eyebrow:'THE RIGHT PERSPECTIVE', title:'Less noise.<br><span>More clarity.</span>', description:'Explore market setups in one focused feed, with data status clearly shown.', art:'market', label:'Discover opportunities' },
 { eyebrow:'THINK RISK FIRST', title:'A plan before<br><span>every trade.</span>', description:'Review entry, target and stop levels when market data is validated. Explore your risk before you act.', art:'risk', label:'Plan your risk' },
 { eyebrow:'MAKE IT YOURS', title:'Your markets.<br><span>Within reach.</span>', description:'Build your watchlist, set price alerts and keep your trade records in one place.', art:'watch', label:'Stay connected' }
];
const names = [...slides.map(s=>s.label),'Sign in','Create account'];
const qs=new URLSearchParams(location.search), gallery=qs.has('gallery'), capture=qs.has('capture');
let current=Math.max(0,Math.min(4,Number(qs.get('screen'))||0));
const host=document.getElementById('device-host');
if(gallery)document.body.classList.add('gallery');
if(capture)document.body.classList.add('capture');
const mark=()=>'<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>';
const brand=()=>'<div class="brand">'+mark()+'<span>tradify<small>signals</small></span></div>';
const status=()=>'<div class="status-bar" aria-hidden="true"><span>9:41</span><span class="status-icons"><span class="reception"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span></div>';
function art(type){
 if(type==='market')return `<div class="scene" role="img" aria-label="Illustration of a gold setup card with a candle chart and a monitoring state. Not live market data."><div class="preview-card market-art"><div class="asset-heading"><div class="asset-id"><div class="asset-symbol">Au</div><div><strong>XAU / USD</strong><small>Gold setup</small></div></div><span class="example-badge">EXAMPLE</span></div><div class="candles" aria-hidden="true">${[[25,5],[34,19],[17,16],[30,30],[22,26],[41,32],[20,51],[18,40],[34,44],[18,64],[24,57],[14,74]].map((a,i)=>`<div class="candle ${[2,4,7,10].includes(i)?'down':''}" style="--h:${a[0]}px;--b:${a[1]}px"></div>`).join('')}</div><div class="mini-footer"><span class="state-dot">Monitoring</span><span>Opportunity feed ↗</span></div></div><div class="floating-label"><b>◎</b> A clearer market view</div></div>`;
 if(type==='risk')return `<div class="scene" role="img" aria-label="Illustrative risk plan: a ten thousand dollar balance, one percent risk, one hundred dollars at risk. Sample target 2430, entry 2400, stop 2385, a two to one reward to risk ratio. Not a trading recommendation."><div class="preview-card risk-art"><div class="risk-top"><strong>Your risk plan</strong><span class="example-badge">EXAMPLE</span></div><div class="risk-main"><div><small>Risk per trade</small><strong>1<span style="font-size:22px">%</span></strong></div><div class="risk-value"><small>Amount at risk</small>$100.00</div></div><div class="level target"><span>Target</span><span>2,430.00</span></div><div class="level entry"><span>Entry</span><span>2,400.00</span></div><div class="level stop"><span>Stop</span><span>2,385.00</span></div><p class="risk-sample">Illustration · $10,000 account balance</p></div><div class="floating-label risk-float"><b>↗</b> 2:1 reward / risk</div></div>`;
 return `<div class="scene" role="img" aria-label="Illustrative watchlist of gold, euro dollar and bitcoin, with a sample gold price alert. Not live prices or an actual notification."><div class="preview-card watch-art"><div class="watch-title"><span>Your watchlist</span><span class="example-badge">EXAMPLE</span></div>${[['Au','XAU / USD','Gold','Monitoring'],['€','EUR / USD','Euro / US Dollar','Watching'],['B','BTC / USD','Bitcoin','Watching']].map(a=>`<div class="watch-row"><div class="asset-id"><div class="asset-symbol">${a[0]}</div><div><strong>${a[1]}</strong><small>${a[2]}</small></div></div><span class="watch-state">${a[3]}</span></div>`).join('')}</div><div class="floating-label watch-float"><span class="bell" aria-hidden="true">◎</span><div><span>Your level. Your alert.</span><small>Gold · Sample price alert</small></div><span aria-hidden="true">↗</span></div></div>`;
}
const legal=()=>'<div class="legal-links"><button type="button" class="plain" data-legal="Terms">Terms</button><span>·</span><button type="button" class="plain" data-legal="Privacy">Privacy</button><span>·</span><button type="button" class="plain" data-legal="Risk information">Risk</button></div>';
function intro(i){const s=slides[i];return `<div class="topbar">${brand()}<button class="plain" data-go="3" aria-label="Skip introduction and sign in">Skip ↗</button></div><section class="carousel" aria-roledescription="carousel" aria-label="Introduction, step ${i+1} of 3"><div class="screen-enter">${art(s.art)}<div class="onboard-copy"><p class="eyebrow">${s.eyebrow}</p><h2>${s.title}</h2><p class="description">${s.description}</p></div></div></section><div class="onboard-actions"><div class="dots" aria-label="Introduction pages">${slides.map((_,k)=>`<button type="button" class="dot" data-go="${k}" aria-label="Go to introduction ${k+1}" ${i===k?'aria-current="step"':''}></button>`).join('')}</div><button class="primary" data-go="${i===2?4:i+1}">${i===2?'Create your account':'Continue'}<span class="arrow" aria-hidden="true">→</span></button><div class="login-prompt">Already have an account? <button class="text-link" data-go="3">Log in</button></div></div>`;}
function auth(i,id){const signup=i===4;return `<div class="topbar auth-top">${brand()}<button type="button" class="icon-button" data-go="${signup?3:0}" aria-label="${signup?'Back to sign in':'Back to introduction'}">←</button></div><div class="auth-content ${signup?'signup-content':''} screen-enter">${signup?'<p class="eyebrow">YOUR NEXT CHAPTER</p>':`<div class="auth-symbol" aria-hidden="true">${mark()}</div>`}<h2>${signup?'Make room for<br>a clearer view.':'Welcome<br>back.'}</h2><p class="description">${signup?'Create your Tradify Signals account.':'Your markets. Your plans. All here.'}</p><form novalidate data-auth="${signup?'signup':'login'}" aria-label="${signup?'Create account':'Sign in'}">${signup?`<div class="field"><label class="field-label" for="${id}-name">Display name</label><div class="input-wrap"><input id="${id}-name" name="name" type="text" autocomplete="nickname" placeholder="How should we call you?" maxlength="80" required></div><p class="field-error" id="${id}-name-error" hidden></p></div>`:''}<div class="field"><label class="field-label" for="${id}-email">Email address</label><div class="input-wrap"><input id="${id}-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required></div><p class="field-error" id="${id}-email-error" hidden></p></div><div class="field"><label class="field-label" for="${id}-password">Password</label><div class="input-wrap"><input id="${id}-password" data-password name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="${signup?'Create a password':'Enter your password'}" required><button type="button" class="reveal" aria-controls="${id}-password" aria-label="Show password">Show</button></div><p class="field-error" id="${id}-password-error" hidden></p></div>${signup?`<div class="consent"><input id="${id}-consent" name="consent" type="checkbox" required><label for="${id}-consent">I agree to the <button type="button" class="text-link" data-legal="Terms">Terms</button> and acknowledge the <button type="button" class="text-link" data-legal="Privacy">Privacy Notice</button> and <button type="button" class="text-link" data-legal="Risk information">risk information</button>.</label></div><p class="field-error" id="${id}-consent-error" hidden></p>`:''}<div class="form-error" role="alert" hidden></div><button type="submit" class="primary">${signup?'Create account':'Log in'}<span class="arrow" aria-hidden="true">→</span></button><div class="login-prompt">${signup?'Already have an account?':'New to Tradify?'} <button type="button" class="text-link" data-go="${signup?3:4}">${signup?'Log in':'Create account'}</button></div></form></div><div class="auth-bottom">${legal()}<p class="risk-note">Trading involves risk. Signals support your decisions; they do not guarantee results.</p></div>`;}
function device(i){const d=document.createElement('div');d.className='device';d.dataset.screen=i;d.innerHTML=`<div class="device-inner">${status()}<div class="app">${i<3?intro(i):auth(i,'s'+i)}</div><div class="home-bar" aria-hidden="true"></div></div>`;bind(d);return d;}
function render(){host.replaceChildren();if(gallery){names.forEach((name,i)=>{const wrap=document.createElement('section');const label=document.createElement('div');label.className='gallery-label';label.textContent=`0${i+1} / ${name}`;wrap.append(label,device(i));host.append(wrap);});document.getElementById('gallery-link').href='?';document.getElementById('gallery-link').textContent='Try the interactive flow ↗';}else{host.append(device(current));}document.querySelector('.nav-screens').innerHTML=names.map((n,i)=>`<button type="button" class="nav-screen" data-screen="${i}" ${i===current?'aria-current="step"':''}><small>0${i+1}</small>${n}</button>`).join('');document.querySelectorAll('[data-screen].nav-screen').forEach(b=>b.onclick=()=>go(Number(b.dataset.screen)));}
function go(i){if(gallery){location.href='?screen='+i;return;}current=i;render();const h=host.querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}const u=new URL(location.href);u.searchParams.set('screen',i);history.replaceState(null,'',u);}
function showSheet(d,title,body,kicker='DESIGN PREVIEW'){const app=d.querySelector('.app');if(app.querySelector('.overlay'))return;const prior=document.activeElement;const layer=document.createElement('div');layer.className='overlay';layer.innerHTML='<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><p class="eyebrow"></p><h3 id="sheet-title"></h3><p class="sheet-body"></p><button type="button" class="primary">Back to preview</button></section>';layer.querySelector('.eyebrow').textContent=kicker;layer.querySelector('h3').textContent=title;layer.querySelector('.sheet-body').textContent=body;const siblings=Array.from(app.children);siblings.forEach(el=>el.inert=true);app.append(layer);const close=()=>{layer.remove();siblings.forEach(el=>el.inert=false);prior?.focus();};const button=layer.querySelector('button');button.onclick=close;layer.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){e.preventDefault();button.focus();}});button.focus();}
function bind(d){d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));d.querySelectorAll('[data-legal]').forEach(b=>b.onclick=()=>showSheet(d,b.dataset.legal,b.dataset.legal==='Risk information'?'Trading can result in losses. This prototype illustrates a decision-support app; it does not place trades. The sample charts and numbers are illustrations, not live data or recommendations.':'In the live app, this opens the existing '+b.dataset.legal.toLowerCase()+' content through /legal. This design preview does not replace your published legal documents.'));
 const carousel=d.querySelector('.carousel');if(carousel){let x=0,y=0;carousel.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY;carousel.setPointerCapture(e.pointerId);});carousel.addEventListener('pointerup',e=>{const dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){const from=Number(d.dataset.screen),target=Math.max(0,Math.min(2,from+(dx<0?1:-1)));if(target!==from)go(target);}});}
 const form=d.querySelector('form');if(!form)return;const reveal=form.querySelector('.reveal');reveal.onclick=()=>{const input=form.elements.password;const shown=input.type==='text';input.type=shown?'password':'text';reveal.textContent=shown?'Show':'Hide';reveal.setAttribute('aria-label',shown?'Show password':'Hide password');};
 const error=(input,msg)=>{const p=d.querySelector('#'+input.id+'-error');input.setAttribute('aria-invalid',String(Boolean(msg)));if(msg){p.textContent=msg;p.hidden=false;input.setAttribute('aria-describedby',p.id);}else{p.hidden=true;input.removeAttribute('aria-describedby');}};
 form.addEventListener('input',e=>{if(e.target.name&&e.target.hasAttribute('aria-invalid'))error(e.target,'');});
 form.addEventListener('change',e=>{if(e.target.name==='consent')error(e.target,'');});
 form.onsubmit=e=>{e.preventDefault();const signup=form.dataset.auth==='signup',issues=[];if(signup&&!form.elements.name.value.trim())issues.push([form.elements.name,'Enter a display name.']);const email=form.elements.email;email.value=email.value.trim();if(!email.value||!email.validity.valid)issues.push([email,'Enter a valid email address.']);const pass=form.elements.password;if(!pass.value)issues.push([pass,'Enter your password.']);if(signup&&!form.elements.consent.checked)issues.push([form.elements.consent,'Please review and accept before continuing.']);issues.forEach(([el,msg])=>error(el,msg));if(issues.length){issues[0][0].focus();return;}const button=form.querySelector('[type=submit]'),original=button.innerHTML;button.disabled=true;button.textContent=signup?'Creating account…':'Logging in…';form.setAttribute('aria-busy','true');setTimeout(()=>{button.disabled=false;button.innerHTML=original;form.removeAttribute('aria-busy');form.elements.password.value='';showSheet(d,'You’ve reached the handoff.',signup?'The account form is ready to connect to your existing registration flow. No account was created and no information was sent.':'The sign-in form is ready to connect to your existing authentication flow. No credentials were sent or stored.');},550);};
}
document.addEventListener('keydown',e=>{if(gallery||current>2||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(Math.min(2,current+1));}if(e.key==='ArrowLeft'){e.preventDefault();go(Math.max(0,current-1));}});
render();
})();
</script>
</body>
</html>
