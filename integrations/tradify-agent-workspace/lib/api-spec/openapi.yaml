openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Live market data and signals
  - name: auth
    description: Trader authentication and account state
  - name: user
    description: Authenticated trader data
  - name: billing
    description: RevenueCat billing lifecycle callbacks
  - name: legal
    description: Public legal and account-deletion resources
  - name: admin
    description: Restricted operations and CRM controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get the live market snapshot
      responses:
        "200":
          description: Current quotes, bridge status, and signal cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"
  /market/quotes:
    get:
      operationId: getMarketQuotes
      tags: [market]
      summary: Get the latest live broker quotes
      description: Returns only the in-memory MT5 quote cache. This endpoint never evaluates strategies or calls fallback providers.
      responses:
        "200":
          description: Latest broker quotes and bridge status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketQuotes"
  /markets/catalog:
    get:
      operationId: getMarketsCatalog
      tags: [market]
      summary: Get the public instrument catalog
      description: Browses the 61 MT5 symbols and the existing core markets. Quote-only symbols remain display-only; membership controls quote visibility and watchlist access.
      responses:
        "200":
          description: Public instrument catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketCatalogItem"
  /market/candles:
    get:
      operationId: getMarketCandles
      tags: [market]
      summary: Get a market candle series
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: M15
        - name: limit
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Customer-safe candle series; provider provenance remains internal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCandles"
        "400":
          description: Invalid symbol or timeframe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCandleError"
        "404":
          description: No candle source is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCandleError"
        "403":
          description: The membership tier does not include this market or trusted setup levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierAccessError"
  /signals/evaluate:
    get:
      operationId: getSignalEvaluation
      tags: [market]
      summary: Evaluate one symbol with the authoritative strategy engine
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: strategy
          in: query
          required: false
          schema:
            type: string
            enum: [DGV8, DGV8_FX, BBB, BBB_GOLD_3S]
      responses:
        "200":
          description: Server-authoritative signal, diagnostic, candle series, and provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalEvaluation"
        "403":
          description: The membership tier does not include this market or signal context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierAccessError"
  /signals/diagnostic:
    get:
      operationId: getSignalDiagnostic
      tags: [market]
      summary: Get strategy gates and validation diagnostics
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: strategy
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Strategy diagnostic and market provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyDiagnostic"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset for an active staff account
      description: Returns the same success response whether or not an active staff account matches the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Generic response that does not disclose whether an account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Email input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many password reset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Password reset email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Set a new password using a single-use reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteInput"
      responses:
        "200":
          description: Password updated and existing sessions invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetCompleteResponse"
        "400":
          description: Reset token is invalid or expired, or the password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many password reset attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Password reset could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in a trader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/admin-session:
    get:
      operationId: getAdminSession
      tags: [auth]
      summary: Get the current staff web session
      responses:
        "200":
          description: Current administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: Staff session is missing or expired
    post:
      operationId: createAdminSession
      tags: [auth]
      summary: Sign in to the staff portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Authenticated administrator session; token is set in an HttpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionResponse"
        "401":
          description: Credentials are invalid
        "403":
          description: Account is not an active administrator
    delete:
      operationId: logoutAdminSession
      tags: [auth]
      summary: End the current staff web session
      responses:
        "200":
          description: Staff session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a trader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Registered session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current trader
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the trader's active sessions
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /user/account:
    delete:
      operationId: deleteUserAccount
      tags: [user]
      summary: Permanently delete the authenticated trader account
      description: An authenticated server-owned deletion flow that clears customer workspace data, anonymizes the account, revokes access, and leaves only limited security, billing, fraud-prevention, or audit records where required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "200":
          description: Account deletion completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "400":
          description: Explicit deletion confirmation is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication is required
        "409":
          description: The account changed while deletion was being processed
        "503":
          description: Deletion is temporarily unavailable
  /user/risk-disclaimer/acknowledge:
    post:
      operationId: acknowledgeRiskDisclaimer
      tags: [user]
      summary: Record the authenticated trader's acknowledgement of the current risk disclaimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskDisclaimerAcknowledgementInput"
      responses:
        "200":
          description: Current disclaimer acknowledgement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Authentication is required
        "409":
          description: The disclaimer version changed and must be reviewed again
  /user/export:
    get:
      operationId: exportUserData
      tags: [user]
      summary: Export the authenticated trader's account data
      responses:
        "200":
          description: Downloadable JSON export of account-owned data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataExport"
  /product-links/journal:
    get:
      operationId: getJournalProductLink
      tags: [user]
      summary: Get the authenticated user's Journal link status
      responses:
        "200":
          description: Current link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalLinkStatusResponse"
        "503":
          description: Linking is disabled or partner status is unavailable
  /product-links/journal/preview:
    post:
      operationId: previewJournalProductLink
      tags: [user]
      summary: Preview a Journal authorization code before separate Signals consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalLinkPreviewInput"
      responses:
        "200":
          description: Pairing labels and unchanged authorization expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalLinkStatusResponse"
        "400":
          description: Invalid authorization code
        "503":
          description: Linking is disabled or Journal is unavailable
  /product-links/journal/claim:
    post:
      operationId: claimJournalProductLink
      tags: [user]
      summary: Record Signals consent and claim a Journal authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalLinkClaimInput"
      responses:
        "200":
          description: Pairing claimed, pending Journal's final confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalLinkStatusResponse"
        "400":
          description: Consent is missing or invalid
        "503":
          description: Linking is disabled or Journal is unavailable
  /product-links/journal/{linkId}:
    delete:
      operationId: unlinkJournalProductLink
      tags: [user]
      summary: Request revocation of the authenticated user's Journal link
      parameters:
        - name: linkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Revocation queued; local link is unusable while pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalLinkStatusResponse"
        "404":
          description: Link not found
        "503":
          description: Linking is disabled
        "401":
          description: Authentication is required
  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get the trader profile
      responses:
        "200":
          description: Trader profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: patchUserProfile
      tags: [user]
      summary: Update the trader profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
  /membership/status:
    get:
      operationId: getMembershipStatus
      tags: [user]
      summary: Get membership entitlements
      responses:
        "200":
          description: Membership entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipStatus"
  /billing/revenuecat/webhook:
    post:
      operationId: receiveRevenueCatWebhook
      tags: [billing]
      summary: Receive an authenticated RevenueCat lifecycle event
      security:
        - RevenueCatWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueCatWebhookRequest"
      responses:
        "200":
          description: Event accepted or safely ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatWebhookResponse"
        "400":
          description: Invalid event payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatBillingError"
        "401":
          description: Invalid webhook authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatBillingError"
        "503":
          description: Event could not be persisted and should be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatBillingError"
  /billing/revenuecat/reconcile:
    post:
      operationId: reconcileRevenueCatTransfers
      tags: [billing]
      summary: Reconcile pending RevenueCat transfers for the current trader
      responses:
        "200":
          description: Reconciliation result and public recovery outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatReconciliationResponse"
        "401":
          description: Authentication is required to reconcile billing transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatBillingError"
        "403":
          description: Suspended accounts cannot reconcile billing transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatBillingError"
        "503":
          description: Reconciliation is temporarily unavailable and should be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueCatBillingError"
  /membership/sync:
    post:
      operationId: syncMembership
      tags: [user]
      summary: Verify the current RevenueCat subscription and synchronize server entitlements
      responses:
        "200":
          description: Verified membership state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipStatus"
  /membership/upgrade:
    post:
      operationId: upgradeMembership
      tags: [user]
      summary: Change the current trader membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpgradeRequest"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipStatus"
  /user/alerts:
    get:
      operationId: getUserAlerts
      tags: [user]
      summary: List price alerts
      responses:
        "200":
          description: User price alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceAlert"
    post:
      operationId: createUserAlert
      tags: [user]
      summary: Create a price alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceAlertInput"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"
        "403":
          description: Pro membership is required to create price alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierAccessError"
  /user/alerts/{id}:
    delete:
      operationId: deleteUserAlert
      tags: [user]
      summary: Delete a price alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /user/notifications:
    get:
      operationId: getUserNotifications
      tags: [user]
      summary: List the authenticated trader's notification history
      responses:
        "200":
          description: User notification history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /user/notification-preferences:
    get:
      operationId: getUserNotificationPreferences
      tags: [user]
      summary: Get the authenticated trader's signal notification preferences
      responses:
        "200":
          description: Event categories enabled for account notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    patch:
      operationId: updateUserNotificationPreferences
      tags: [user]
      summary: Update the authenticated trader's signal notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: Updated event preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
  /user/expo-push/device:
    put:
      operationId: registerExpoPushDevice
      tags: [user]
      summary: Register this authenticated mobile installation for signal push alerts
      description: Registration is idempotent for the same account and device token. Signal category preferences and current market entitlements still apply at delivery time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpoPushDeviceRegistration"
      responses:
        "200":
          description: Device is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceResponse"
        "201":
          description: Device was registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceResponse"
        "403":
          description: Account does not currently have signal notification access
        "409":
          description: Device token is already assigned to another account
    delete:
      operationId: revokeExpoPushDevice
      tags: [user]
      summary: Revoke this mobile installation's push registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpoPushDeviceRegistration"
      responses:
        "200":
          description: Device registration revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /user/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [user]
      summary: Mark one notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
  /user/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [user]
      summary: Mark the authenticated trader's notifications as read
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /user/trades:
    get:
      operationId: getUserTrades
      tags: [user]
      summary: List saved trades
      responses:
        "200":
          description: User trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerTrade"
    post:
      operationId: createUserTrade
      tags: [user]
      summary: Save a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResponse"
        "403":
          description: The membership tier does not include this market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierAccessError"
  /user/trades/{id}/actions:
    post:
      operationId: actOnUserTrade
      tags: [user]
      summary: Apply a trade lifecycle action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeAction"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResponse"
        "403":
          description: The membership tier does not include trade management for this market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierAccessError"
  /watchlist:
    get:
      operationId: getWatchlist
      tags: [user]
      summary: List watched symbols
      responses:
        "200":
          description: Watched symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: addWatchlistSymbol
      tags: [user]
      summary: Add a watched symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolInput"
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
  /watchlist/{symbol}:
    delete:
      operationId: removeWatchlistSymbol
      tags: [user]
      summary: Remove a watched symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
  /user/watchlist/{symbol}/alert:
    put:
      operationId: setWatchlistAlert
      tags: [user]
      summary: Set the quick alert state for a watched symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAlertInput"
      responses:
        "200":
          description: Updated alert state
          content:
            application/json:
              schema:
                type: object
                required: [ok, active]
                properties:
                  ok:
                    type: boolean
                  active:
                    type: boolean
        "403":
          description: Pro membership is required to use quick price alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TierAccessError"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get restricted operations overview
      responses:
        "200":
          description: Engine, bridge, and user summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/billing/transfers:
    get:
      operationId: getAdminBillingTransfers
      tags: [admin]
      summary: View pending billing transfers and reconciliation outcomes
      description: Returns safe operational metadata for administrators without provider credentials or entitlement data.
      parameters:
        - name: failureCategory
          in: query
          required: false
          description: Return outcomes in the selected safe failure category across the recorded billing recovery history. Pending transfers are not filtered.
          schema:
            $ref: "#/components/schemas/BillingTransferFailureCategory"
        - name: accountIds
          in: query
          required: false
          description: Return pending transfers and audited outcomes involving any listed source or destination account ID. Send one or more accountIds query values; comma-separated values are also accepted.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
        - name: accountId
          in: query
          required: false
          deprecated: true
          description: Legacy single-account alias. Use accountIds for one or more participating accounts.
          schema:
            type: string
            minLength: 1
        - name: eventId
          in: query
          required: false
          description: Return only the audited recovery outcome for the exact transfer event ID. Pending transfers are not filtered.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Pending destination identifiers and audited transfer outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBillingTransfersResponse"
        "400":
          description: Unsupported failure category
  /admin/billing/catalog:
    get:
      operationId: getAdminRevenueCatPriceSummary
      tags: [admin]
      summary: Read the current RevenueCat offering and indicative prices
      description: Reads the current offering and package products from RevenueCat. Prices are indicative USD/US values when RevenueCat reports them; no catalog or store settings are changed.
      responses:
        "200":
          description: Read-only current offering and product price summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRevenueCatPriceSummary"
        "503":
          description: RevenueCat catalog data is unavailable
