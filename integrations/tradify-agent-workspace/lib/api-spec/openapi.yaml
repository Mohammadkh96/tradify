      summary: Create a sanitized transfer incident handoff
      description: Returns a read-only plain-text handoff built from administrator-safe transfer metadata. It never includes provider credentials or entitlement data.
      parameters:
        - name: eventId
          in: query
          required: true
          description: Transfer event identifier from the administrator billing recovery list.
          schema:
            type: string
            minLength: 1
        - name: accountIds
          in: query
          required: false
          description: Preserve source or destination match explanations for the selected account filter.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
      responses:
        "200":
          description: Sanitized administrator incident handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBillingTransferHandoff"
        "400":
          description: Invalid event or account identifier
        "404":
          description: Transfer event was not found or did not match the supplied account filter
