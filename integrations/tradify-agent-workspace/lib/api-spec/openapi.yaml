                $ref: "#/components/schemas/AdminUserMutationResponse"
  /admin/crm/users/{id}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Change a member's administrator role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRolePatch"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserMutationResponse"
  /admin/crm/users/{id}/account-state:
    patch:
      operationId: updateAdminUserAccountState
      tags: [admin]
      summary: Suspend, ban, or reactivate a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountStatePatch"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserMutationResponse"
  /admin/crm/audit-logs:
    get:
      operationId: getAdminCrmAuditLogs
      tags: [admin]
      summary: Get filtered and paginated global administrator audit history
      parameters:
        - name: page
          in: query
          schema: { type: number, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: number, minimum: 1, maximum: 200 }
        - name: actorId
          in: query
          schema: { type: string }
        - name: targetUserId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Filtered administrator audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditEntry"
  /admin/operations/health:
    get:
      operationId: getAdminOperationsHealth
      tags: [admin]
      summary: Get detailed engine, bridge, validator, and recovery health
      responses:
        "200":
          description: Operations health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    RevenueCatWebhook:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        acceptRiskDisclaimer:
          type: boolean
        riskDisclaimerVersion:
          type: string
    RiskDisclaimerAcknowledgementInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
    PasswordResetRequestInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    PasswordResetCompleteInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        password:
          type: string
          minLength: 12
          maxLength: 128
    PasswordResetRequestResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
    PasswordResetCompleteResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
    AccountDeletionInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [DELETE]
          description: Explicit confirmation that the customer understands the account will be permanently deleted.
    AccountDeletionResponse:
      type: object
      additionalProperties: false
      required: [ok, requestId, completedAt, subscriptionAction]
      properties:
        ok: { type: boolean }
        requestId: { type: string }
        completedAt:
          type: string
          format: date-time
        subscriptionAction: { type: string }
    UserDataExport:
      type: object
      additionalProperties: false
      required: [version, exportedAt, account, profile, watchlist, alertSymbols, alerts, notifications, trades, membership]
      properties:
        version: { type: string, enum: ["1"] }
        exportedAt: { type: string, format: date-time }
        account:
          type: object
          additionalProperties: false
          required: [id, email, createdAt]
          properties:
            id: { type: string }
            email: { type: string }
            createdAt: { type: string, format: date-time }
        profile:
          type: object
          additionalProperties: true
        watchlist:
          type: array
          items: { type: string }
        alertSymbols:
          type: array
          items: { type: string }
        alerts:
          type: array
          items: { type: object, additionalProperties: true }
        notifications:
          type: array
          items: { type: object, additionalProperties: true }
        trades:
          type: array
          items: { type: object, additionalProperties: true }
        membership:
          type: object
          additionalProperties: false
          required: [tier]
          properties:
            tier: { type: string }
            source: { type: ["string", "null"] }
            status: { type: ["string", "null"] }
            expiresAt: { type: ["string", "null"], format: date-time }
            willRenew: { type: ["boolean", "null"] }
    PublicAccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          pattern: "^[^@\\\\s]+@[^@\\\\s]+\\\\.[^@\\\\s]+$"
    AuthResponse:
      type: object
      required: [ok, user]
      properties:
        ok:
          type: boolean
        token:
          type: string
          description: Omitted when an HttpOnly browser session cookie is issued.
        user:
          $ref: "#/components/schemas/UserProfile"
    AdminSessionResponse:
      type: object
      required: [ok, user, staff]
      properties:
        ok:
          type: boolean
        user:
          $ref: "#/components/schemas/UserProfile"
        staff:
          $ref: "#/components/schemas/StaffAccessSummary"
    RegistrationResponse:
      allOf:
        - $ref: "#/components/schemas/AuthResponse"
        - type: object
          required: [recovery]
          properties:
            recovery:
              $ref: "#/components/schemas/RevenueCatTransferRecoveryOutcome"
    JournalLinkPreviewInput:
      type: object
      additionalProperties: false
      required: [contractVersion, authorizationCode]
      properties:
        contractVersion:
          type: string
          const: tradify-account-linking-v1
        authorizationCode:
          type: string
          pattern: "^[a-f0-9]{64}$"
    JournalLinkClaimInput:
      type: object
      additionalProperties: false
      required: [contractVersion, authorizationCode, consent, consentVersion]
      properties:
        contractVersion:
          type: string
          const: tradify-account-linking-v1
        authorizationCode:
          type: string
          pattern: "^[a-f0-9]{64}$"
        consent:
          type: boolean
          const: true
        consentVersion:
          type: string
          const: tradify-signals-link-consent-v1
    JournalLinkStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [unlinked, awaiting_signals_consent, awaiting_journal_confirmation, active, revocation_pending, revoked]
        contractVersion:
          type: string
        linkId:
          type: string
        journalAttemptLabel:
          type: string
        signalsAttemptLabel:
          type: string
        expiresAt:
          type: string
          format: date-time
        linkedAt:
          type: [string, "null"]
        eventId:
          type: string
        duplicate:
          type: boolean
        payloadSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    JournalLinkStatusResponse:
      allOf:
        - $ref: "#/components/schemas/JournalLinkStatus"
    CurrentUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required: [id, name, email, accountSize, riskPercent, maxDailyLoss, maxTrades, aggressive, membership, role, status, entitlements, createdAt, lastSeenAt, watchlist, alertSymbols, riskDisclaimerVersion, riskDisclaimerAcceptedAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        accountSize:
          type: number
        riskPercent:
          type: number
        maxDailyLoss:
          type: number
        maxTrades:
          type: number
        aggressive:
          type: boolean
        membership:
          type: string
          enum: [Free, Pro, VIP]
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, suspended, deleted]
        riskDisclaimerVersion:
          type: string
          nullable: true
        riskDisclaimerAcceptedAt:
          type: string
          format: date-time
          nullable: true
        entitlements:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        watchlist:
          type: array
          items:
            type: string
        alertSymbols:
          type: array
          items:
            type: string
    UserProfilePatch:
      type: object
      properties:
        name:
          type: string
        accountSize:
          type: number
        riskPercent:
          type: number
        maxDailyLoss:
          type: number
        maxTrades:
          type: number
        aggressive:
          type: boolean
    UserProfileResponse:
      type: object
      required: [ok, user]
      properties:
        ok:
          type: boolean
        user:
          $ref: "#/components/schemas/UserProfile"
    MembershipStatus:
      type: object
      required: [membership, source, entitlements, billingStatus, expiresAt, willRenew, provider, accessPolicy]
      properties:
        membership:
          type: string
          enum: [Free, Pro, VIP]
        source:
          type: string
          enum: [UNKNOWN, REVENUECAT, ADMIN_OVERRIDE]
        entitlements:
          type: array
          items:
            type: string
        billingStatus:
          type: string
          enum: [ACTIVE, CANCELLED, EXPIRED, PAST_DUE, INACTIVE, UNAVAILABLE]
        expiresAt:
          type: [string, "null"]
          format: date-time
        willRenew:
          type: boolean
        provider:
          type: string
          enum: [REVENUECAT]
        accessPolicy:
          $ref: "#/components/schemas/CustomerAccessPolicy"
    CustomerMembershipTier:
      type: string
      enum: [Free, Pro, VIP]
    CustomerFeatureMinimumTiers:
      type: object
      additionalProperties: false
      required: [signalContext, trustedSetupLevels, performanceContext, priceAlerts, fullDepthReview]
      properties:
        signalContext:
          $ref: "#/components/schemas/CustomerMembershipTier"
        trustedSetupLevels:
          $ref: "#/components/schemas/CustomerMembershipTier"
        performanceContext:
          $ref: "#/components/schemas/CustomerMembershipTier"
        priceAlerts:
          $ref: "#/components/schemas/CustomerMembershipTier"
        fullDepthReview:
          $ref: "#/components/schemas/CustomerMembershipTier"
    CustomerMarketTiers:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/CustomerMembershipTier"
    CustomerWatchlistLimits:
      type: object
      additionalProperties: false
