        Free:
          type: number
          minimum: 1
          maximum: 500
        Pro:
          type: number
          minimum: 1
          maximum: 500
        VIP:
          type: number
          nullable: true
    CustomerAccessPolicy:
      type: object
      additionalProperties: false
      required: [rowVersion, featureMinimumTiers, marketTiers, watchlistLimits]
      properties:
        rowVersion:
          type: number
        featureMinimumTiers:
          $ref: "#/components/schemas/CustomerFeatureMinimumTiers"
        marketTiers:
          $ref: "#/components/schemas/CustomerMarketTiers"
        watchlistLimits:
          $ref: "#/components/schemas/CustomerWatchlistLimits"
    AdminAccessPolicyMarket:
      type: object
      additionalProperties: false
      required: [symbol, name, requiredTier, marketType]
      properties:
        symbol:
          type: string
        name:
          type: string
        requiredTier:
          $ref: "#/components/schemas/CustomerMembershipTier"
        marketType:
          type: string
          enum: [STRATEGY, QUOTE_ONLY]
    AdminEstimatedMembershipTierCounts:
      type: object
      additionalProperties: false
      required: [Free, Pro, VIP]
      properties:
        Free:
          type: number
          minimum: 0
        Pro:
          type: number
          minimum: 0
        VIP:
          type: number
          minimum: 0
    AdminEstimatedWatchlistSizeBucket:
      type: object
      additionalProperties: false
      required: [membershipTier, savedSymbolCount, customerCount]
      properties:
        membershipTier:
          $ref: "#/components/schemas/CustomerMembershipTier"
        savedSymbolCount:
          type: number
          minimum: 0
        customerCount:
          type: number
          minimum: 0
    AdminAccessPolicy:
      type: object
      additionalProperties: false
      required: [rowVersion, featureMinimumTiers, marketTiers, watchlistLimits, starterSymbols, markets, estimatedMembershipTierCounts, estimatedWatchlistSizeDistribution]
      properties:
        rowVersion:
          type: number
        featureMinimumTiers:
          $ref: "#/components/schemas/CustomerFeatureMinimumTiers"
        marketTiers:
          $ref: "#/components/schemas/CustomerMarketTiers"
        watchlistLimits:
          $ref: "#/components/schemas/CustomerWatchlistLimits"
        starterSymbols:
          type: array
          items:
            type: string
        markets:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccessPolicyMarket"
        estimatedMembershipTierCounts:
          description: Aggregate snapshot of active, non-deleted customer accounts by current membership tier; estimates are not tied to individual identities.
          $ref: "#/components/schemas/AdminEstimatedMembershipTierCounts"
        estimatedWatchlistSizeDistribution:
          description: Aggregate count of active, non-deleted customer accounts grouped by current membership tier and distinct saved-symbol count; no customer identities are included.
          type: array
          items:
            $ref: "#/components/schemas/AdminEstimatedWatchlistSizeBucket"
    AdminAccessPolicyUpdate:
      type: object
      additionalProperties: false
      required: [rowVersion, featureMinimumTiers, marketTiers, watchlistLimits]
      properties:
        rowVersion:
          type: number
        featureMinimumTiers:
          $ref: "#/components/schemas/CustomerFeatureMinimumTiers"
        marketTiers:
          $ref: "#/components/schemas/CustomerMarketTiers"
        watchlistLimits:
          $ref: "#/components/schemas/CustomerWatchlistLimits"
    MembershipUpgradeRequest:
      type: object
      additionalProperties: false
      required: [membership]
      properties:
        membership:
          type: string
          enum: [Pro, VIP]
    RevenueCatWebhookRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          type: object
          additionalProperties: true
          required: [id, type, app_user_id]
          properties:
            id: { type: string }
            type: { type: string }
            app_user_id: { type: string }
            entitlement_ids:
              type: array
              items: { type: string }
            event_timestamp_ms:
              type: number
            purchased_at_ms:
              type: number
            expiration_at_ms:
              type: number
            period_type: { type: string }
    RevenueCatWebhookResponse:
      type: object
      additionalProperties: false
      required: [ok, eventId, result]
      properties:
        ok: { type: boolean }
        eventId: { type: string }
        result:
          type: string
          enum: [processed, duplicate, stale, ignored]
    RevenueCatReconciliationResponse:
      type: object
      additionalProperties: false
      required: [ok, result, recovery]
      properties:
        ok: { type: boolean }
        result:
          $ref: "#/components/schemas/RevenueCatTransferResult"
        recovery:
          $ref: "#/components/schemas/RevenueCatTransferRecoveryOutcome"
    RevenueCatTransferResult:
      type: string
      enum: [processed, duplicate, stale, ignored, deferred]
    RevenueCatTransferRecoveryOutcome:
      type: string
      enum: [recovered, already-recovered, provider-deferred]
    RevenueCatBillingError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [AUTH_REQUIRED, USER_SUSPENDED, BILLING_WEBHOOK_UNAUTHORIZED, INVALID_BILLING_WEBHOOK, BILLING_WEBHOOK_RETRY]
          description: Stable billing failure code. Retry only BILLING_WEBHOOK_RETRY after the temporary provider or persistence failure has cleared.
    MarketSnapshot:
      type: object
      additionalProperties: false
      required: [timestamp, bridge, quotes, signals, marketSetups]
      properties:
        timestamp:
          type: string
        bridge:
          type: object
          additionalProperties: false
          required: [connected]
          properties:
            connected: { type: boolean }
        quotes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MarketQuote"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalCard"
        marketSetups:
          type: array
          items:
            $ref: "#/components/schemas/MarketSetupAssignment"
    MarketQuotes:
      type: object
      additionalProperties: false
      required: [timestamp, bridge, quotes]
      properties:
        timestamp:
          type: string
          format: date-time
        bridge:
          type: object
          additionalProperties: false
          required: [connected]
          properties:
            connected: { type: boolean }
        quotes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MarketQuote"
    MarketQuote:
      type: object
      additionalProperties: false
      required: [symbol, bid, ask, last, price, displayPrice, change, changePercent, time, receivedAt, status, dataState]
      properties:
        symbol: { type: string }
        bid: { type: number }
        ask: { type: number }
        last: { type: number }
        price: { type: number }
        displayPrice: { type: number }
        change: { type: number }
        changePercent: { type: number }
        changeBasis: { type: string, enum: [STREAM, PREVIOUS_CLOSE, 24H] }
        time: { type: number }
        receivedAt: { type: number }
        status: { type: string, enum: [LIVE, FALLBACK, STALE, UNAVAILABLE] }
        dataState: { type: string, enum: [LIVE, FALLBACK, STALE, ERROR] }
        sourceTimestamp: { type: number }
        sourceAgeSeconds: { type: number, minimum: 0 }
        referenceState: { type: string, enum: [REFERENCE, STALE, UNAVAILABLE] }
        referenceCondition: { type: string, enum: [ACTIVE_SOURCE, MARKET_CLOSED, STALE_SOURCE, UNAVAILABLE] }
        referenceType: { type: string, enum: [REGULAR_MARKET_PRICE, LAST_TRADE, SPOT_REFERENCE] }
        referenceBasis: { type: string, enum: [PREVIOUS_CLOSE, USDT, XAU_USD] }
    BrokerSpecification:
      type: object
      required: [brokerSymbol, receivedAt]
      properties:
        brokerSymbol: { type: string }
        contractSize: { type: ["number", "null"] }
        tickSize: { type: ["number", "null"] }
        tickValue: { type: ["number", "null"] }
        tickValueProfit: { type: ["number", "null"] }
        tickValueLoss: { type: ["number", "null"] }
        volumeMin: { type: ["number", "null"] }
        volumeMax: { type: ["number", "null"] }
        volumeStep: { type: ["number", "null"] }
        digits: { type: ["number", "null"] }
        point: { type: ["number", "null"] }
        quoteCurrency: { type: ["string", "null"] }
        receivedAt: { type: number }
    BrokerSizingState:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [READY, REVIEW_REQUIRED] }
        reason: { type: string }
    MarketCatalogItem:
      type: object
      additionalProperties: false
      required: [symbol, name, assetClass, digits, sizingStatus, currentPrice, bid, ask, quoteState, opportunityState, availableSetups, defaultSetupLabel, requiredTier, accessible, strategySupported]
      properties:
        symbol: { type: string }
        name: { type: string }
        assetClass: { type: string, enum: [FOREX, METALS, INDICES, CRYPTO, COMMODITIES, STOCKS, OTHER] }
        digits: { type: number }
        sizingStatus: { type: string, enum: [READY, REVIEW_REQUIRED] }
        currentPrice: { type: number }
        bid: { type: number }
        ask: { type: number }
        quoteState: { type: string, enum: [LIVE, REFERENCE, SYNCING, DISCONNECTED] }
        opportunityState: { type: string, enum: [ACTIVE, PAUSED] }
        availableSetups:
          type: array
          items: { type: string, enum: ["Gold setup", "FX setup", "BBB setup", "BBB Gold 3S"] }
        defaultSetupLabel:
          type: [string, "null"]
          enum: ["Gold setup", "FX setup", "BBB setup", "BBB Gold 3S", null]
        requiredTier: { type: string, enum: [Free, Pro, VIP] }
        accessible: { type: boolean }
        strategySupported: { type: boolean }
    MarketCandle:
      type: object
      additionalProperties: false
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
    MarketCandles:
      type: object
      additionalProperties: false
      required: [symbol, timeframe, timezone, candles, dataState, displayOnly, validation, count, firstTime, lastTime]
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        timezone:
          type: string
        count:
          type: number
        firstTime:
          type: [number, "null"]
        lastTime:
          type: [number, "null"]
        candles:
          type: array
          items:
            $ref: "#/components/schemas/MarketCandle"
        dataState:
          type: string
          enum: [LIVE, FALLBACK, STALE, ERROR]
        displayOnly:
          type: boolean
          description: True when the series is safe for chart display but must not be used for strategy evaluation.
        validation:
          type: object
          additionalProperties: false
          required: [valid, candleCount]
          properties:
            valid: { type: boolean }
            candleCount: { type: number }
            reason: { type: string }
    MarketCandleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [INVALID_SYMBOL, INVALID_TIMEFRAME, NO_CANDLE_DATA]
        symbol: { type: string }
        timeframe: { type: string }
        dataState: { type: string, enum: [ERROR] }
        displayOnly: { type: boolean, enum: [false] }
    MarketSetupAssignment:
      type: object
      additionalProperties: false
      required: [symbol, setupLabel, availableSetups]
      properties:
        symbol: { type: string }
        setupLabel:
          type: [string, "null"]
          enum: ["Gold setup", "FX setup", "BBB setup", "BBB Gold 3S", null]
        availableSetups:
          type: array
          items: { type: string, enum: ["Gold setup", "FX setup", "BBB setup", "BBB Gold 3S"] }
    SignalCard:
      type: object
      additionalProperties: false
      required: [id, symbol, name, market, direction, grade, action, lifecycleStatus, qualified, price, entry, stop, tp1, tp2, tp3, targets, session, age, dataState, levels]
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        market: { type: string, enum: [FOREX, METALS, INDICES, CRYPTO, COMMODITIES, STOCKS, OTHER] }
        direction: { type: string, enum: [LONG, SHORT, NONE] }
        grade: { type: string, enum: [A+, A, B] }
        action: { type: string }
        lifecycleStatus: { type: string }
        qualified: { type: boolean }
        price: { type: number }
        entry: { type: number }
        stop: { type: number }
        tp1: { type: number }
        tp2: { type: number }
        tp3: { type: number }
        targets:
          type: array
          items: { type: number }
        session: { type: string }
        age: { type: string }
        dataState: { type: string, enum: [LIVE, FALLBACK, STALE, ERROR] }
        setupLabel:
          type: string
          enum: ["Gold setup", "FX setup", "BBB setup", "BBB Gold 3S"]
        levels:
          type: object
          additionalProperties: false
          required: [direction, entry, buyEntry, sellEntry, stop, targets]
          properties:
            direction: { type: string, enum: [LONG, SHORT, NONE] }
            entry: { type: number }
            buyEntry: { type: [number, "null"] }
            sellEntry: { type: [number, "null"] }
            sourceHigh: { type: [number, "null"] }
